[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopf-fibration"
version = "0.1.0"
description = "Interactive visualisation of Hopf fibrations, parallel transport, and fibre bundles on the unit sphere."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Brian O'Sullivan", email = "bmw.osullivan@gmail.com" },
]
keywords = [
    "hopf-fibration",
    "parallel-transport",
    "fibre-bundles",
    "differential-geometry",
    "opengl",
    "3d-visualisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "glfw>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/mo-geometry/hopf_fibration"
Repository = "https://github.com/mo-geometry/hopf_fibration"
Issues = "https://github.com/mo-geometry/hopf_fibration/issues"

[project.scripts]
hopf-fibration = "hopf_fibration.__main__:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["hopf_fibration"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "moderngl.*",
    "moderngl_window.*",
    "glfw.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=hopf_fibration",
    "--cov-report=term-missing",
]
markers = [
    "gpu: tests that require a GPU/OpenGL context (deselect with '-m \"not gpu\"')",
    "slow: tests that take more than a few seconds",
]
